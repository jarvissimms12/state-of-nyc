name: monthly data refresh

# Re-pulls every source from NYC Open Data on the 2nd of each month, reruns
# the analysis, and commits the updated tables and figures if anything changed.
on:
  schedule:
    - cron: "17 11 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
      - run: python analysis/run_analysis.py
      - run: pytest -q
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/processed docs
          git diff --cached --quiet || git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
          git push
